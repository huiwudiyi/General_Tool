<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 编辑器</title>
<!-- marked：Markdown 解析；highlight.js：代码高亮 -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- MathJax：LaTeX 公式渲染，支持 $...$ 行内、$$...$$ 与 \[...\] 块级 -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    svg: { fontCache: 'global' },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --border: #e2e8f0;
    --primary: #2563eb; --primary-hover: #1d4ed8;
    --text: #1e293b; --muted: #64748b; --code-bg: #f6f8fa;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header .title { font-size: 18px; font-weight: 700; }
  header .title small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 7px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { background: var(--code-bg); border-color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }

  .workspace { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane-head {
    padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--muted);
    background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .divider { width: 1px; background: var(--border); }

  #editor {
    flex: 1; width: 100%; border: none; outline: none; resize: none;
    padding: 18px 20px; font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 14px; line-height: 1.8; color: var(--text); background: #fff;
    tab-size: 2;
  }
  #preview {
    flex: 1; overflow-y: auto; padding: 24px 28px; background: #fff;
    font-size: 15px; line-height: 1.75; word-wrap: break-word;
  }

  /* 预览区排版 */
  #preview h1, #preview h2, #preview h3, #preview h4 {
    margin: 20px 0 12px; line-height: 1.3; font-weight: 700;
  }
  #preview h1 { font-size: 28px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
  #preview h2 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  #preview h3 { font-size: 18px; }
  #preview h4 { font-size: 16px; }
  #preview p { margin: 12px 0; }
  #preview ul, #preview ol { margin: 12px 0; padding-left: 26px; }
  #preview li { margin: 4px 0; }
  #preview blockquote {
    margin: 14px 0; padding: 8px 16px; color: var(--muted);
    border-left: 4px solid var(--primary); background: var(--code-bg); border-radius: 0 6px 6px 0;
  }
  #preview code {
    background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 90%; color: #d63384;
  }
  #preview pre {
    background: var(--code-bg); padding: 14px 16px; border-radius: 8px;
    overflow-x: auto; margin: 14px 0; border: 1px solid var(--border);
  }
  #preview pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
  #preview table {
    border-collapse: collapse; margin: 14px 0; width: 100%; font-size: 14px;
  }
  #preview th, #preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  #preview th { background: var(--code-bg); font-weight: 600; }
  #preview tr:nth-child(even) { background: #fafbfc; }
  #preview img { max-width: 100%; border-radius: 6px; }
  #preview a { color: var(--primary); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  #preview :first-child { margin-top: 0; }
</style>
</head>
<body>
<header>
  <div class="title">Markdown 编辑器 <small>左侧编辑 · 右侧实时预览 · 支持中英文</small></div>
  <div class="actions">
    <button class="btn" id="sampleBtn">示例</button>
    <button class="btn" id="clearBtn">清空</button>
    <button class="btn" id="copyBtn">复制 HTML</button>
    <button class="btn btn-primary" id="downloadBtn">下载 .md</button>
  </div>
</header>

<div class="workspace">
  <div class="pane">
    <div class="pane-head">
      <span>编辑区 Markdown</span>
      <span id="wordCount">0 字</span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="在此输入 Markdown，支持中英文……"></textarea>
  </div>
  <div class="divider"></div>
  <div class="pane">
    <div class="pane-head"><span>预览区</span></div>
    <div id="preview"></div>
  </div>
</div>
<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const wordCount = document.getElementById('wordCount');

// 配置 marked：支持 GFM、换行即断行、代码高亮
marked.setOptions({
  gfm: true,
  breaks: true,
  highlight: function (code, lang) {
    if (window.hljs) {
      try {
        return lang && hljs.getLanguage(lang)
          ? hljs.highlight(code, { language: lang }).value
          : hljs.highlightAuto(code).value;
      } catch (e) { /* 忽略高亮错误，回退为纯文本 */ }
    }
    return code;
  }
});

// 实时渲染 + 字数统计（中英文分别计数）
function render() {
  const src = editor.value;

  // 1) 先保护 LaTeX 公式片段，避免其中的 _ ^ \ 等被 Markdown 解析破坏
  const math = [];
  const stash = s => { math.push(s); return `%%MATH${math.length - 1}%%`; };
  let protectedSrc = src
    .replace(/\$\$[\s\S]+?\$\$/g, stash)          // 块级 $$...$$
    .replace(/\\\[[\s\S]+?\\\]/g, stash)          // 块级 \[...\]
    .replace(/\\\([\s\S]+?\\\)/g, stash)          // 行内 \(...\)
    .replace(/\$(?!\s)[^\$\n]+?(?<!\s)\$/g, stash); // 行内 $...$（避免误伤货币符号）

  // 2) Markdown 解析
  let out = marked.parse(protectedSrc);

  // 3) 还原公式片段
  out = out.replace(/%%MATH(\d+)%%/g, (_, i) => math[+i]);

  preview.innerHTML = out;

  // 4) MathJax 排版
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetClear && MathJax.typesetClear([preview]);
    MathJax.typesetPromise([preview]).catch(() => {});
  }

  const cn = (src.match(/[\u4e00-\u9fa5]/g) || []).length;
  const en = (src.match(/[a-zA-Z]+/g) || []).length;
  wordCount.textContent = `${cn} 中文字 · ${en} 英文词`;
}

let timer = null;
editor.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(render, 120); // 轻量防抖，兼顾流畅与实时
});

// 工具栏
document.getElementById('clearBtn').onclick = () => {
  editor.value = ''; render(); editor.focus();
};
document.getElementById('copyBtn').onclick = async (e) => {
  try {
    await navigator.clipboard.writeText(preview.innerHTML);
    flash(e.currentTarget, '已复制');
  } catch (err) { alert('复制失败，请手动选择预览内容'); }
};
document.getElementById('downloadBtn').onclick = () => {
  const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document.md';
  a.click();
  URL.revokeObjectURL(a.href);
};
function flash(btn, text) {
  const old = btn.textContent;
  btn.textContent = text;
  setTimeout(() => (btn.textContent = old), 1200);
}
const SAMPLE = `# Markdown 编辑器示例

这是一个支持**中英文混排**的 Markdown editor，左侧编辑、右侧实时预览。

## 一、文本样式

支持 **加粗**、*斜体*、~~删除线~~、\`行内代码\`，以及[超链接](https://www.baidu.com)。

> 引用块：好的排版让阅读成为一种享受。
> Good typography makes reading a pleasure.

## 二、列表

无序列表：
- 苹果 Apple
- 香蕉 Banana
  - 嵌套项 Nested item

有序列表：
1. 第一步
2. 第二步
3. 第三步

## 三、代码块

\`\`\`javascript
function greet(name) {
  console.log(\`你好, \${name}!\`);
}
greet("世界");
\`\`\`

## 四、表格

| 语言 | 类型 | 年份 |
| --- | --- | --- |
| Python | 动态 | 1991 |
| Rust | 静态 | 2010 |
| 中文名 | 编程语言 | 现代 |

## 五、LaTeX 公式

支持行内公式，如质能方程 $E = mc^2$、勾股定理 $a^2 + b^2 = c^2$。

块级公式（一元二次方程求根公式）：

$$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$

高斯积分与矩阵：

$$\\int_{-\\infty}^{+\\infty} e^{-x^2}\\, dx = \\sqrt{\\pi}, \\quad
A = \\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}$$

## 六、其他

- [x] 已完成任务
- [ ] 待办任务

---

排版优美，中英文与公式皆宜。Enjoy writing!`;

document.getElementById('sampleBtn').onclick = () => { editor.value = SAMPLE; render(); };

// 初始化：载入示例
editor.value = SAMPLE;
render();

// MathJax 异步加载完成后再渲染一次，确保初次公式正常显示
if (window.MathJax && MathJax.startup) {
  MathJax.startup.promise.then(render);
} else {
  window.addEventListener('load', () => setTimeout(render, 600));
}

</script>
</body>
</html>
