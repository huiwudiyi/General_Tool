# 默认 client，不同节点没有特殊指定时使用它
default_client:
  base_url: "http://10.11.175.3/tianchi/chat/completions"
  api_key: 'Bearer 13af0a5f5048000a72509152a644'
  timeout: 120
  max_retry: 3

# 可选：定义多个 endpoint/client
clients:
  small:
      base_url: "http://10.11.175.3/tianchi/chat/completions"
      api_key: 'Bearer 13af0a5f5048000a72509152a644'
      timeout: 120
      max_retry: 3

  strong:
      base_url: "http://10.11.175.3/tianchi/chat/completions"
      api_key: 'Bearer 13af0a5f5048000a72509152a644'
      timeout: 120
      max_retry: 3

# 每个节点使用哪个模型
node_model_map:
  describe: "deepseek-v4-flash"
  summary: "deepseek-v4-flash"
  judge: "deepseek-v4-flash"
  optimizer: "deepseek-v4-flash"
  criticle: "deepseek-v4-flash"
  # 描述生成器 π_θ（待训练策略）
  policy: "deepseek-v4-flash"
  # LLM Selector（冻结裁判）
  selector: "deepseek-v4-flash"
  # 失败案例定向精修
  refiner: "deepseek-v4-flash"

# 每个节点使用哪个 client
# 如果所有节点都走 default_client，这一段可以不写
node_llm_client_map:
  describe: strong
  summary: strong
  judge: strong
  optimizer: strong
  criticle: strong
  policy: strong
  selector: strong
  refiner: strong

# 每个节点的 temperature
node_temperature_map:
  describe: 0.8
  summary: 0.8
  judge: 0.8
  optimizer: 0.8
  criticle: 0.8
  # 策略节点温度调高：GRPO 依赖 group 内采样多样性，温度过低会让 G 条描述近似相同、优势全为 0
  policy: 1.0
  # 裁判节点固定 0.0：冻结判定需稳定可复现，否则奖励噪声会盖过策略本身的改进
  selector: 0.0
  # 精修是定向修改而非探索，温度调低以贴住失败案例、少发挥
  refiner: 0.3



